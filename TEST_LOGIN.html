<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔐 Supabase Login Test</h1>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" value="jeflowers@gmail.com" placeholder="Enter email">

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password">

        <button onclick="testLogin()">Test Login</button>
        <button onclick="checkEnv()">Check Environment</button>
        <button onclick="checkSession()">Check Session</button>
    </div>

    <div id="result"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Get environment variables from your .env
        const SUPABASE_URL = 'https://qdcykazqmowkmkhykepb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkY3lrYXpxbW93a21raHlrZXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk4NjQwNzEsImV4cCI6MjA3NTQ0MDA3MX0.lDeWRNri-hPV6JMH2tRiwvYrN64hOKYuGUhre6rQeaA';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.supabase = supabase;

        window.testLogin = async function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = '<p>⏳ Testing login...</p>';

            try {
                // Test 1: Auth login
                console.log('Testing login for:', email);
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (authError) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Login Failed</h3>
                            <p><strong>Error:</strong> ${authError.message}</p>
                            <pre>${JSON.stringify(authError, null, 2)}</pre>
                        </div>
                    `;
                    return;
                }

                console.log('Auth success:', authData);

                // Test 2: Fetch user from users table
                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', authData.user.id)
                    .single();

                if (userError) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>⚠️ Auth Success but User Table Error</h3>
                            <p>Authentication succeeded but couldn't fetch user from database.</p>
                            <p><strong>Error:</strong> ${userError.message}</p>
                            <pre>${JSON.stringify(userError, null, 2)}</pre>
                        </div>
                    `;
                    return;
                }

                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Login Successful!</h3>
                        <p><strong>Email:</strong> ${userData.email}</p>
                        <p><strong>Name:</strong> ${userData.name}</p>
                        <p><strong>Role:</strong> ${userData.role}</p>
                        <p><strong>User ID:</strong> ${userData.id}</p>
                        <h4>Auth Data:</h4>
                        <pre>${JSON.stringify(authData.user, null, 2)}</pre>
                        <h4>User Data:</h4>
                        <pre>${JSON.stringify(userData, null, 2)}</pre>
                    </div>
                `;

            } catch (err) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Unexpected Error</h3>
                        <p>${err.message}</p>
                        <pre>${JSON.stringify(err, null, 2)}</pre>
                    </div>
                `;
            }
        };

        window.checkEnv = function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="result success">
                    <h3>🔧 Environment Check</h3>
                    <p><strong>Supabase URL:</strong> ${SUPABASE_URL}</p>
                    <p><strong>Has Anon Key:</strong> ${SUPABASE_ANON_KEY ? '✅ Yes' : '❌ No'}</p>
                    <p><strong>Key Length:</strong> ${SUPABASE_ANON_KEY?.length || 0} characters</p>
                </div>
            `;
        };

        window.checkSession = async function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Checking session...</p>';

            const { data: { session }, error } = await supabase.auth.getSession();

            if (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Session Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                return;
            }

            if (!session) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>⚠️ No Active Session</h3>
                        <p>You are not currently logged in.</p>
                    </div>
                `;
                return;
            }

            resultDiv.innerHTML = `
                <div class="result success">
                    <h3>✅ Active Session Found</h3>
                    <p><strong>User Email:</strong> ${session.user.email}</p>
                    <p><strong>Expires:</strong> ${new Date(session.expires_at * 1000).toLocaleString()}</p>
                    <pre>${JSON.stringify(session.user, null, 2)}</pre>
                </div>
            `;
        };
    </script>
</body>
</html>
