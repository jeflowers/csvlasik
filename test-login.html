<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Login Test</h1>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" value="jeflowers@gmail.com"><br>
        <input type="password" id="password" placeholder="Password"><br>
        <button type="submit">Login</button>
    </form>
    <pre id="output"></pre>

    <script>
        const SUPABASE_URL = 'https://qdcykazqmowkmkhykepb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkY3lrYXpxbW93a21raHlrZXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk4NjQwNzEsImV4cCI6MjA3NTQ0MDA3MX0.lDeWRNri-hPV6JMH2tRiwvYrN64hOKYuGUhre6rQeaA';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const output = document.getElementById('output');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            output.textContent = 'Attempting login...\n';

            try {
                // Step 1: Auth
                output.textContent += '\n1. Authenticating with Supabase...\n';
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (authError) {
                    output.textContent += `❌ Auth error: ${authError.message}\n`;
                    return;
                }

                output.textContent += `✅ Auth successful! User ID: ${authData.user.id}\n`;

                // Step 2: Get session
                output.textContent += '\n2. Getting session...\n';
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();

                if (sessionError || !session) {
                    output.textContent += `❌ Session error: ${sessionError?.message || 'No session'}\n`;
                    return;
                }

                output.textContent += `✅ Session exists! User: ${session.user.email}\n`;

                // Step 3: Query users table
                output.textContent += '\n3. Querying users table...\n';
                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .select('id,email,name,role,created_at,updated_at')
                    .eq('id', authData.user.id)
                    .maybeSingle();

                if (userError) {
                    output.textContent += `❌ User query error: ${userError.message}\n`;
                    output.textContent += `Error details: ${JSON.stringify(userError, null, 2)}\n`;
                    return;
                }

                if (!userData) {
                    output.textContent += `❌ No user data found\n`;
                    return;
                }

                output.textContent += `✅ User data retrieved!\n`;
                output.textContent += JSON.stringify(userData, null, 2) + '\n';

                // Step 4: Check role
                output.textContent += '\n4. Checking role in roles table...\n';
                const { data: roleData, error: roleError } = await supabase
                    .from('roles')
                    .select('name,level')
                    .eq('name', userData.role)
                    .maybeSingle();

                if (roleError) {
                    output.textContent += `❌ Role query error: ${roleError.message}\n`;
                    return;
                }

                if (!roleData) {
                    output.textContent += `❌ Invalid role: ${userData.role}\n`;
                    return;
                }

                output.textContent += `✅ Valid role: ${roleData.name} (level ${roleData.level})\n`;
                output.textContent += '\n🎉 LOGIN SUCCESSFUL!\n';

            } catch (err) {
                output.textContent += `\n❌ Exception: ${err.message}\n`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
