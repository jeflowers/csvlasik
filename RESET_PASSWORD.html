<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        button {
            background-color: #dc3545;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #c82333;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🔐 Reset Admin Password</h1>
    <p><strong>Warning:</strong> This will reset the password for the admin user.</p>

    <div>
        <label for="email">Admin Email:</label>
        <input type="email" id="email" value="jeflowers@gmail.com" readonly>

        <label for="newPassword">New Password (min 6 characters):</label>
        <input type="password" id="newPassword" placeholder="Enter new password">

        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password">

        <button onclick="resetPassword()">Reset Password</button>
    </div>

    <div id="result"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://qdcykazqmowkmkhykepb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkY3lrYXpxbW93a21raHlrZXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk4NjQwNzEsImV4cCI6MjA3NTQ0MDA3MX0.lDeWRNri-hPV6JMH2tRiwvYrN64hOKYuGUhre6rQeaA';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.resetPassword = async function() {
            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resultDiv = document.getElementById('result');

            // Validation
            if (!newPassword || newPassword.length < 6) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Validation Error</h3>
                        <p>Password must be at least 6 characters long.</p>
                    </div>
                `;
                return;
            }

            if (newPassword !== confirmPassword) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Validation Error</h3>
                        <p>Passwords do not match.</p>
                    </div>
                `;
                return;
            }

            resultDiv.innerHTML = '<p>⏳ Resetting password...</p>';

            try {
                // First, send a password reset email
                const { error: resetError } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: 'http://localhost:5173/admin/login'
                });

                if (resetError) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Reset Failed</h3>
                            <p>${resetError.message}</p>
                        </div>
                    `;
                    return;
                }

                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Password Reset Email Sent!</h3>
                        <p>Check your email inbox for <strong>${email}</strong></p>
                        <p>Click the link in the email to reset your password.</p>
                        <p><strong>Note:</strong> The email may take a few minutes to arrive.</p>
                        <p>Check your spam folder if you don't see it.</p>
                    </div>
                `;

            } catch (err) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Unexpected Error</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
