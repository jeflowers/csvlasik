    <!-- Extension interference protection -->
    <script>
      (function() {
        // Freeze critical prototypes before extensions load
        if (window.Element && window.Element.prototype) {
          Object.freeze(window.Element.prototype);
        }

        // Protect against extension DOM mutations during load
        window.__appLoading = true;

        // Store original timing functions
        window.__originalSetInterval = window.setInterval;
        window.__originalSetTimeout = window.setTimeout;
        window.__originalRequestAnimationFrame = window.requestAnimationFrame;

        // Throttle extension-injected timers during load
        const loadThrottle = (fn, threshold = 100) => {
          let lastCall = 0;
          return function(...args) {
            const now = Date.now();
            if (now - lastCall >= threshold) {
              lastCall = now;
              return fn.apply(this, args);
            }
          };
        };

        // Override with throttled versions during load
        window.setInterval = new Proxy(window.__originalSetInterval, {
          apply(target, thisArg, args) {
            if (window.__appLoading && !args[0]?.toString().includes('React')) {
              args[0] = loadThrottle(args[0], 1000);
            }
            return Reflect.apply(target, thisArg, args);
          }
        });

        window.requestAnimationFrame = new Proxy(window.__originalRequestAnimationFrame, {
          apply(target, thisArg, args) {
            if (window.__appLoading) {
              const callback = args[0];
              args[0] = (timestamp) => {
                try {
                  return callback(timestamp);
                } catch (e) {
                  // Silently catch extension errors
                  if (!e.stack?.includes('chrome-extension://')) {
                    throw e;
                  }
                }
              };
            }
            return Reflect.apply(target, thisArg, args);
          }
        });
      })();
    </script>
