<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
</helmet>

<div style="width:100%; min-height:360px; background:radial-gradient(120% 160% at 50% -40%, #211c15 0%, #100f0d 60%); font-family:'Jost',sans-serif;">
  <header style="position:relative; width:100%; background:linear-gradient(180deg,#1b1712 0%,#121110 100%); border-bottom:1px solid rgba(200,161,91,.22);">
    <div style="position:absolute; left:0; right:0; top:0; height:1px; background:linear-gradient(90deg,transparent,rgba(200,161,91,.4),transparent);"></div>

    <!-- top utility strip -->
    <sc-if value="{{ showTopStrip }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; justify-content:flex-end; gap:24px; height:42px; padding:0 48px; border-bottom:1px solid rgba(236,232,224,.07);">
        <a href="#" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:#A8A39A;" style-hover="color:#E2C88B;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C8A15B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
          <span style="font-family:'Jost',sans-serif; font-size:12px; letter-spacing:.04em;">(844) 954-8686</span>
        </a>
        <span style="width:1px; height:14px; background:rgba(236,232,224,.13);"></span>
        <a href="#" style="display:flex; align-items:center; gap:6px; text-decoration:none; color:#A8A39A;" style-hover="color:#E2C88B;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></svg>
          <span style="font-family:'Jost',sans-serif; font-size:11.5px; letter-spacing:.1em;">ES-MX</span>
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </a>
        <span style="width:1px; height:14px; background:rgba(236,232,224,.13);"></span>
        <a href="#" style="display:flex; align-items:center; gap:7px; text-decoration:none; color:#A8A39A;" style-hover="color:#E2C88B;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span style="font-family:'Jost',sans-serif; font-size:11.5px; letter-spacing:.08em;">Patient Portal</span>
        </a>
      </div>
    </sc-if>

    <!-- main row -->
    <div style="display:flex; align-items:center; justify-content:space-between; height:82px; padding:0 48px;">
      <div style="display:flex; align-items:center; gap:18px;">
        <svg width="48" height="26" viewBox="0 0 60 32" fill="none"><path d="M2 16 C14 4 46 4 58 16 C46 28 14 28 2 16 Z" stroke="#ECE8E0" stroke-width="1.3"/><circle cx="30" cy="16" r="7" stroke="#C8A15B" stroke-width="1.3"/><circle cx="30" cy="16" r="2.3" fill="#C8A15B"/></svg>
        <div style="width:1px; height:34px; background:rgba(236,232,224,.16);"></div>
        <div style="display:flex; flex-direction:column; align-items:flex-start;">
          <div style="font-family:'Cormorant Garamond',serif; font-weight:600; font-size:28px; line-height:1; letter-spacing:.30em; color:#F1EDE5; padding-left:.30em;">ATELIER</div>
          <div style="font-family:'Jost',sans-serif; font-weight:500; font-size:10px; letter-spacing:.46em; color:#C8A15B; margin-top:7px; padding-left:.46em;">LASIK</div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:40px;">
        <nav style="display:flex; align-items:center; gap:40px;">
          <a href="#" style="font-family:'Jost',sans-serif; font-weight:400; font-size:14.5px; letter-spacing:.03em; color:#DAD6CE; text-decoration:none;" style-hover="color:#E2C88B;">Procedures</a>
          <a href="#" style="font-family:'Jost',sans-serif; font-weight:400; font-size:14.5px; letter-spacing:.03em; color:#DAD6CE; text-decoration:none;" style-hover="color:#E2C88B;">Dr. Flowers</a>
          <a href="#" style="font-family:'Jost',sans-serif; font-weight:400; font-size:14.5px; letter-spacing:.03em; color:#DAD6CE; text-decoration:none;" style-hover="color:#E2C88B;">Journal</a>
          <a href="#" style="font-family:'Jost',sans-serif; font-weight:400; font-size:14.5px; letter-spacing:.03em; color:#DAD6CE; text-decoration:none;" style-hover="color:#E2C88B;">Financing</a>
        </nav>
        <span style="width:1px; height:26px; background:rgba(236,232,224,.13);"></span>
        <sc-if value="{{ isOutline }}" hint-placeholder-val="{{ true }}">
          <a href="#" style="display:inline-flex; align-items:center; height:44px; padding:0 26px; border:1px solid #C8A15B; color:#E2C88B; font-family:'Jost',sans-serif; font-weight:600; font-size:12px; letter-spacing:.2em; border-radius:3px; text-decoration:none;" style-hover="background:#C8A15B; color:#16130D;">BOOK CONSULT</a>
        </sc-if>
        <sc-if value="{{ isFilled }}" hint-placeholder-val="{{ false }}">
          <a href="#" style="display:inline-flex; align-items:center; height:44px; padding:0 26px; background:#C8A15B; color:#16130D; font-family:'Jost',sans-serif; font-weight:600; font-size:12px; letter-spacing:.2em; border-radius:3px; text-decoration:none;" style-hover="background:#E2C88B;">BOOK CONSULT</a>
        </sc-if>
      </div>
    </div>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:360},&quot;showTopStrip&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ctaVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;outline&quot;,&quot;filled&quot;],&quot;default&quot;:&quot;outline&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.ctaVariant ?? 'outline';
    return {
      showTopStrip: this.props.showTopStrip ?? true,
      isOutline: variant === 'outline',
      isFilled: variant === 'filled',
    };
  }
}
</script>
</body>
</html>
