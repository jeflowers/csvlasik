<!DOCTYPE html>
<html>
<head>
    <title>Simple Auth Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        button { background: #0f0; color: #000; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; }
        pre { background: #000; padding: 10px; border: 1px solid #0f0; }
        .error { color: #f00; }
        .success { color: #0f0; }
    </style>
</head>
<body>
    <h1>Simple Supabase Auth Test</h1>
    <button onclick="testAuth()">Test Login</button>
    <button onclick="clearLogs()">Clear</button>
    <pre id="log"></pre>

    <script>
        const log = document.getElementById('log');

        function addLog(msg, isError = false) {
            const line = document.createElement('div');
            line.className = isError ? 'error' : 'success';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(line);
            console.log(msg);
        }

        function clearLogs() {
            log.innerHTML = '';
        }

        async function testAuth() {
            clearLogs();
            addLog('Starting auth test...');

            const SUPABASE_URL = 'https://qdcykazqmowkmkhykepb.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkY3lrYXpxbW93a21raHlrZXBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk4NjQwNzEsImV4cCI6MjA3NTQ0MDA3MX0.lDeWRNri-hPV6JMH2tRiwvYrN64hOKYuGUhre6rQeaA';

            // Test 1: Network connectivity
            addLog('Test 1: Checking network connectivity...');
            try {
                const response = await fetch(SUPABASE_URL + '/rest/v1/', { method: 'HEAD' });
                addLog(`✓ Network OK (status: ${response.status})`);
            } catch (err) {
                addLog(`✗ Network FAILED: ${err.message}`, true);
                return;
            }

            // Test 2: Create client
            addLog('Test 2: Creating Supabase client...');
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            addLog('✓ Client created');

            // Test 3: Simple auth call
            addLog('Test 3: Calling signInWithPassword...');
            const email = 'jeflowers@gmail.com';
            const password = prompt('Enter password:');

            if (!password) {
                addLog('✗ No password provided', true);
                return;
            }

            const startTime = Date.now();

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                const duration = Date.now() - startTime;
                addLog(`Auth call completed in ${duration}ms`);

                if (error) {
                    addLog(`✗ Auth ERROR: ${error.message}`, true);
                    addLog(`Error code: ${error.status}`, true);
                    return;
                }

                addLog('✓ AUTH SUCCESS!');
                addLog(`User ID: ${data.user.id}`);
                addLog(`Email: ${data.user.email}`);
                addLog(`Session: ${data.session ? 'YES' : 'NO'}`);

                // Sign out
                await supabase.auth.signOut();
                addLog('✓ Signed out successfully');

            } catch (err) {
                const duration = Date.now() - startTime;
                addLog(`✗ Exception after ${duration}ms: ${err.message}`, true);
                addLog(`Stack: ${err.stack}`, true);
            }
        }
    </script>
</body>
</html>
